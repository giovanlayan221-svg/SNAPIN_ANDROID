name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Download kode dari repository GitHub
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Java JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Jalankan perintah Gradle di dalam subfolder project yang benar
    - name: Generate Gradle Wrapper & Build APK
      run: |
        # Cari tahu letak folder project jika terbungkus subfolder
        # Jika file build.gradle ada di dalam folder SNAPIN_ANDROID kedua, arahkan ke sana:
        cd SNAPIN_ANDROID || true
        
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew
        ./gradlew assembleDebug

    # 4. Simpan hasil file APK agar bisa di-download di tab Actions GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
