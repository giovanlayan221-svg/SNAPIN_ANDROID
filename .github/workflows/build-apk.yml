name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Download kode dari repository GitHub
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Java JDK 17 (Standar buat project Android sekarang)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Beri izin eksekusi ke gradlew (agar bisa jalan di Linux)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Jalankan build APK Debug
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # 5. Simpan file APK hasil build agar bisa didownload di menu Actions GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
