name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Download kode dari repository GitHub[span_0](start_span)[span_0](end_span)
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Java JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Generate Gradle Wrapper secara otomatis (mencegah error gradlew hilang)
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    # 4. Beri izin eksekusi ke gradlew agar bisa jalan di Linux
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Jalankan proses build Debug APK
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # 6. Simpan hasil file APK agar bisa di-download di tab Actions GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
