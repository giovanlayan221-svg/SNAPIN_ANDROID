name: Build APK

# Jalan otomatis tiap ada file baru di repo, atau manual dari tab Actions.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Project bisa ada di root repo, di dalam subfolder (mis. SNAPIN_ANDROID/), atau masih berupa file zip.
      # Langkah ini mengekstrak zip (kalau ada) lalu mencari folder yang berisi settings.gradle(.kts).
      - name: Temukan folder project
        run: |
          for z in $(find . -maxdepth 3 -type f -iname "snapin-android*.zip" -not -path "./.git/*"); do
            echo "Mengekstrak $z"
            unzip -o "$z" -d "$(dirname "$z")"
          done
          S=$(find . -maxdepth 4 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path "./.git/*" | awk '{print length($0) " " $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$S" ]; then
            echo "::error::settings.gradle(.kts) tidak ditemukan. Pastikan isi project (folder app, settings.gradle.kts, build.gradle.kts) ada di repo."
            find . -maxdepth 3 -not -path "./.git/*" | head -60
            exit 1
          fi
          DIR=$(dirname "$S")
          echo "Project ada di: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      # Wajib Gradle 8.x (AGP 8.5.2 tidak jalan di Gradle 9)
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snapin-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
